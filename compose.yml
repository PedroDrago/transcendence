services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - transcendence-internal

  db-bootstrap:
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./ops/init.sql:/bootstrap/init.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql \
          --host=database \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --file=/bootstrap/init.sql
    networks:
      - transcendence-internal

  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/$${R2_BUCKET} && \
        minio server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-transcendence-media}
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - transcendence-internal

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    networks:
      - transcendence-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm start -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  gateway:
    build:
      context: ./backend/api/transcendence-api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      posts-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:3002
      CHAT_SERVICE_URL: http://chat-service:4002
      POSTS_SERVICE_URL: http://posts-service:3333
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-public
      - transcendence-internal

  auth-service:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      USER_SERVICE_URL: http://user-service:3002
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GOOGLE_TEST_CALLBACK_URL: ${GOOGLE_TEST_CALLBACK_URL}
      FRONTEND_OAUTH_SUCCESS_URL: ${FRONTEND_OAUTH_SUCCESS_URL}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4001/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  chat-service:
    build:
      context: ./backend/services/chat
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      MIX_ENV: dev
      PORT: 4002
      PHX_IP: 0.0.0.0
      PHX_SERVER: "true"
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DEV_SECRET_KEY_BASE: ${DEV_SECRET_KEY_BASE}
    command: sh -c "mix ecto.migrate && mix phx.server"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4002/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  posts-service:
    build:
      context: ./backend/services/posts
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      ORIGIN: ${FRONTEND_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: ${R2_BUCKET:-transcendence-media}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_NAME: posts-service
      OTEL_EXPORTER_URL: http://jaeger:4318/v1/traces
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3333/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  user-service:
    build:
      context: ./backend/services/user-management
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - user-management-avatars:/app/uploads/avatars
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3002/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

networks:
  transcendence-public:
    driver: bridge
  transcendence-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  user-management-avatars:
