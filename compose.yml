services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - transcendence-internal

  db-bootstrap:
    image: postgres:16-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./ops/init.sql:/bootstrap/init.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql \
          --host=database \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --file=/bootstrap/init.sql
    networks:
      - transcendence-internal

  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/$${R2_BUCKET} && \
        minio server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
      R2_BUCKET: ${MINIO_BUCKET}
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - transcendence-internal

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    networks:
      - transcendence-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    command: npm start -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-public
      - transcendence-internal

  gateway:
    build:
      context: ./backend/api/transcendence-api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      posts-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    env_file:
      - path: ./backend/api/transcendence-api-gateway/.env
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-public
      - transcendence-internal

  auth-service:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
    env_file:
      - path: ./backend/services/auth/.env
        required: false
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4001/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  chat-service:
    build:
      context: ./backend/services/chat
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    env_file:
      - path: ./backend/services/chat/.env
        required: false
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    command: sh -c "mix ecto.migrate && mix phx.server"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4002/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  posts-service:
    build:
      context: ./backend/services/posts
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: ./backend/services/posts/.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      OTEL_EXPORTER_URL: ${OTEL_EXPORTER_URL}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3333/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-public
      - transcendence-internal

  user-service:
    build:
      context: ./backend/services/user-management
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    env_file:
      - path: ./backend/services/user-management/.env
        required: false
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - user-management-avatars:/app/uploads/avatars
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3002/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-internal

  nginx:
    image: nginx:1.27.0-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${API_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    networks:
      - transcendence-public
      - transcendence-internal

networks:
  transcendence-public:
    driver: bridge
  transcendence-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  user-management-avatars:
